services:
  backend:
    build:
      context: ./backend
    container_name: app3-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      PORT: ${BACKEND_PORT:-8080}
      DB_PATH: ${DB_PATH:-/data/task-harbor.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    volumes:
      - backend-data:/data
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
    container_name: app3-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  backend-data:
